name: Backtest CI
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '0 0 * * 0'
  workflow_dispatch:
jobs:
  backtest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Backtest BTC
        run: node backtest.mjs --symbol BTCUSDT --limit 500
      - name: Backtest ETH
        run: node backtest.mjs --symbol ETHUSDT --limit 500
      - name: Upload results
        uses: actions/upload-artifact@v4
        with:
          name: backtest-results
          path: data/backtest-*.json
          if-no-files-found: warn
